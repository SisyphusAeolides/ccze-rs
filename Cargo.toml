[package]
name = "ccze-rs"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
authors = ["Kenny Glowner <SisyphusAeolides@pm.me>"]
description = "Fast streaming log colorizer with native analytics and formally specified protocol verification"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SisyphusAeolides/ccze-rs"
homepage = "https://github.com/SisyphusAeolides/ccze-rs"
documentation = "https://docs.rs/ccze-rs"
keywords = ["logs", "colorizer", "syslog", "terminal", "monitoring"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = [".github/", "packaging/", "scripts/", "Makefile", "ccze-rs.spec"]

[features]
default = []
system-integration = ["dep:bincode", "dep:num_cpus", "dep:serde"]

[[bin]]
name = "ccze"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.53", features = ["derive"] }
memchr = "2.8.0"
num_cpus = { version = "1.16", optional = true }
tokio = { version = "1.49.0", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }

[build-dependencies]
cc = "1.2.55"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
